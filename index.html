<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doodle Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .sidebar-btn {
      transform: scale(1);
      background-color: rgba(var(--btn-rgb, 255,255,255), 0.3);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background-color 180ms ease-out, filter 150ms ease-out,
                  transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 120ms ease-out;
    }
    @media (hover: hover) and (pointer: fine) {
      .sidebar-btn:hover {
        background-color: rgba(var(--btn-rgb, 255,255,255), 0.6);
        transform: scale(1.15);
      }
    }
    .sidebar-btn.is-pressed {
      background-color: rgba(var(--btn-rgb, 255,255,255), 0.6);
      filter: brightness(0.85);
      transform: scale(1.05);
    }
    #btn-brush {
      position: relative;
      width: 56px;
      height: 165.75px;
      border-radius: 9999px;
      background-color: rgba(255,255,255,0.3);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: background-color 180ms ease-out, filter 150ms ease-out,
                  transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 120ms ease-out;
    }
    #btn-brush-knob {
      position: absolute;
      left: 12.25px;
      width: 31.5px;
      height: 31.5px;
      touch-action: none;
    }
    #btn-brush-knob,
    #btn-brush-knob:hover,
    #btn-brush-knob.is-pressed {
      background-color: rgba(255,255,255,1);
    }
  </style>
</head>
<body>

<div id="app" style="width:100%;height:100%;position:relative;overflow:hidden;">

  <canvas id="canvas" style="position:absolute;top:0;right:0;bottom:0;left:0;touch-action:none;"></canvas>

  <!-- Menu Toggle -->
  <button id="btn-menu" style="position:absolute;top:24px;right:24px;z-index:50;--btn-rgb:31,41,55;"
    class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center sidebar-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>
    </svg>
  </button>

  <!-- Toolbar -->
  <div id="toolbar" style="position:absolute;top:96px;right:24px;z-index:40;display:flex;flex-direction:column;gap:12px;">
    <button id="btn-new-shape" title="New Shape" style="--btn-rgb:255,255,255;"
      class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center sidebar-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
    <button id="btn-clear" title="Clear" style="--btn-rgb:255,255,255;"
      class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center sidebar-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
    <button id="btn-download" title="Download" style="--btn-rgb:255,255,255;"
      class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center sidebar-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
    </button>
    <button id="btn-settings" title="Shape Settings" style="--btn-rgb:255,255,255;"
      class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center sidebar-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <button id="btn-color" title="Color" style="--btn-rgb:255,255,255;"
      class="w-14 h-14 rounded-full shadow-lg flex items-center justify-center sidebar-btn">
      <svg width="33" height="33" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect id="btn-color-swatch" width="32" height="32" rx="16" fill="#000000"/>
        <path id="btn-color-icon" d="M23.387 7.67399C23.6451 7.63868 23.905 7.72657 24.0893 7.91081C24.2735 8.09504 24.3614 8.35498 24.3261 8.61312C23.9804 11.1402 22.9583 13.5267 21.3687 15.5215C19.9311 17.3255 18.0765 18.7465 15.97 19.6686C16.0553 20.3774 15.9572 21.098 15.6827 21.7609C15.3674 22.5221 14.8337 23.1732 14.1487 23.631C13.4635 24.0889 12.6575 24.3333 11.8334 24.3333H8.50008C8.03984 24.3333 7.66675 23.9602 7.66675 23.5V20.1667C7.66675 19.3426 7.91122 18.5366 8.36906 17.8514C8.82689 17.1663 9.47794 16.6327 10.2392 16.3174C10.9018 16.043 11.6222 15.9441 12.3306 16.0293C13.2528 13.923 14.6747 12.0689 16.4786 10.6313C18.4733 9.04183 20.8599 8.01966 23.387 7.67399ZM15.0577 14.5571C14.6179 15.1873 14.2349 15.8576 13.9167 16.5615C14.2299 16.7425 14.5209 16.9622 14.7794 17.2207C15.0376 17.4789 15.2569 17.7698 15.4377 18.0825C16.1417 17.7643 16.8119 17.3814 17.4421 16.9416C16.8647 15.9555 16.0439 15.1344 15.0577 14.5571ZM22.4592 9.54004C20.6595 9.96116 18.9702 10.7763 17.517 11.9342C17.0131 12.3358 16.5439 12.7755 16.1108 13.2461C17.1803 13.9154 18.0837 14.8191 18.7532 15.8885C19.2238 15.4554 19.6643 14.987 20.0658 14.4831C21.2239 13.0298 22.0382 11.34 22.4592 9.54004ZM9.33341 22.6667H11.8334C12.3279 22.6667 12.8115 22.5198 13.2226 22.2451C13.6335 21.9705 13.9538 21.5803 14.143 21.1237C14.3322 20.667 14.3818 20.1641 14.2854 19.6792C14.2751 19.6274 14.2615 19.5762 14.248 19.5254C14.238 19.5045 14.2286 19.4831 14.2203 19.4611C14.2 19.4074 14.1859 19.3529 14.1772 19.2983C14.0526 18.962 13.8568 18.6549 13.601 18.3991C13.3446 18.1427 13.0366 17.9467 12.6993 17.8221C12.6456 17.8133 12.5918 17.7997 12.539 17.7798C12.5166 17.7713 12.4951 17.7614 12.4739 17.7513C12.4234 17.7379 12.3724 17.7249 12.3209 17.7147C11.836 17.6183 11.3331 17.6679 10.8764 17.8571C10.4198 18.0463 10.0296 18.3666 9.75496 18.7775C9.48026 19.1886 9.33341 19.6722 9.33341 20.1667V22.6667Z" fill="black"/>
      </svg>
    </button>
    <div id="btn-brush" title="Brush Size" class="shadow-lg">
      <svg viewBox="0 0 32 108" width="42" height="141.75"
           style="position:absolute;top:12px;left:7px;pointer-events:none;" aria-hidden="true">
        <path d="M4.99655 11.9586C4.46009 5.52109 9.54022 0 16 0C22.4598 0 27.5399 5.52109 27.0035 11.9585L19.2491 105.01C19.1083 106.7 17.6957 108 16 108C14.3043 108 12.8917 106.7 12.7509 105.01L4.99655 11.9586Z" fill="rgba(0,0,0,0.3)"/>
      </svg>
      <div id="btn-brush-knob" class="sidebar-btn rounded-full border-2 shadow-lg"
           style="top:122.25px;border-color:#838383;"></div>
    </div>
  </div>

  <!-- Download Modal -->
  <div id="preview-modal" class="bg-black/50 items-center justify-center" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;">
    <div class="bg-white rounded-lg shadow-2xl max-w-6xl w-[calc(100%-32px)] flex flex-col" style="max-height:calc(100vh - 32px);">
      <div class="p-4 border-b border-gray-200 flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold text-gray-800">Download Doodles</h2>
          <p class="text-sm text-gray-500 mt-0.5">Select doodles to save:</p>
        </div>
        <button id="btn-close-preview" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="overflow-auto p-4" style="flex:1;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div style="display:flex;flex-direction:column;">
            <h3 class="text-center font-semibold text-gray-700 mb-2">Before</h3>
            <div id="before-container" onclick="toggleImageSelection('before')"
              class="flex items-center justify-center rounded-lg p-2 cursor-pointer transition-all ring-1 ring-gray-200 opacity-50"
              style="flex:1;">
              <img id="before-img" style="max-width:100%;max-height:300px;object-fit:contain;" alt="Before">
            </div>
          </div>
          <div style="display:flex;flex-direction:column;">
            <h3 class="text-center font-semibold text-gray-700 mb-2">After</h3>
            <div id="after-container" onclick="toggleImageSelection('after')"
              class="flex items-center justify-center rounded-lg p-2 cursor-pointer transition-all ring-2 ring-blue-500 ring-offset-2"
              style="flex:1;">
              <img id="after-img" style="max-width:100%;max-height:300px;object-fit:contain;" alt="After">
            </div>
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-gray-200 flex gap-3 justify-end items-center">
        <p id="mobile-hint" class="text-sm text-gray-500 text-center w-full" style="display:none;">Long press an image to save or share on mobile</p>
        <button id="btn-cancel-preview" class="px-6 py-3 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium transition-colors">Cancel</button>
        <button id="btn-save-doodles" class="px-6 py-3 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-medium transition-colors flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
          </svg>
          Save Doodles
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="bg-black/50 items-center justify-center" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;">
    <div class="bg-white rounded-lg shadow-2xl max-w-md w-[calc(100%-32px)]">
      <div class="p-4 border-b border-gray-200 flex justify-between items-center">
        <h2 class="text-xl font-bold text-gray-800">Shape Settings</h2>
        <button id="btn-close-settings" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 space-y-4">
        <!-- Shape color -->
        <div class="flex justify-between items-center">
          <span class="text-gray-700 font-medium">Shape color</span>
          <div class="flex gap-2">
            <button id="shape-color-white" onclick="setShapesColor('#ffffff')"
              class="w-8 h-8 rounded-full border-2 border-blue-500 transition-all scale-110"
              style="background-color:#ffffff;"></button>
            <button id="shape-color-black" onclick="setShapesColor('#000000')"
              class="w-8 h-8 rounded-full border-2 border-gray-300 transition-all"
              style="background-color:#000000;"></button>
          </div>
        </div>
        <!-- Sliders -->
        <div id="sliders-container"></div>
      </div>
      <div class="p-4 border-t border-gray-200 flex justify-end">
        <button id="btn-done-settings" class="px-6 py-3 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-medium transition-colors">Done</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ── State ─────────────────────────────────────────────────────────────────
  const pastels = ['#FFB3BA','#FFDFBA','#BAFFC9','#BAE1FF','#E0BBE4','#FFDFD3','#D4F1F4','#FFE5E5','#E5F9E0'];
  const brushSizes = [2, 8, 15, 22, 30];

  let ctx, isDrawing = false;
  let brushSize = 2, brushIndex = 0;
  let color = '#000000', colorIndex = 0;
  let menuOpen = true;
  const TOOLBAR_BUTTON_IDS = ['btn-new-shape','btn-clear','btn-download','btn-settings','btn-color','btn-brush'];
  const CASCADE_STAGGER_MS = 40;
  const CASCADE_TRANSFORM_MS = 300; // matches .sidebar-btn's transform transition duration
  let cascadeTimeouts = [];
  let bgColor = randomPastel();
  let shapesColor = '#ffffff';
  let shapeSettings = { ovals: 2, quads: 1, rectangles: 1, curves: 1, triangles: 1 };
  let beforeImage = null, previewImage = null;
  let selectedImages = new Set(['after']);

  function randomPastel() {
    return pastels[Math.floor(Math.random() * pastels.length)];
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  function init() {
    const canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    buildSliders();
    generateRandomShape();
    bindEvents();
    syncMenuButtonVisual();
    updateColorIcon();
    syncBrushKnobPosition();
    updateCursor();

    window.addEventListener('resize', () => {
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.putImageData(img, 0, 0);
    });
  }

  // ── Sliders ───────────────────────────────────────────────────────────────
  function buildSliders() {
    const shapes = ['ovals', 'quads', 'rectangles', 'curves', 'triangles'];
    document.getElementById('sliders-container').innerHTML = shapes.map(s => `
      <div>
        <label style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="text-gray-700 font-medium" style="text-transform:capitalize;">${s}</span>
          <span id="val-${s}" class="text-gray-600 text-sm">${shapeSettings[s]}</span>
        </label>
        <input type="range" min="0" max="10" value="${shapeSettings[s]}"
          class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
          oninput="updateShapeSetting('${s}', this.value)">
      </div>
    `).join('');
  }

  function updateShapeSetting(shape, value) {
    shapeSettings[shape] = parseInt(value);
    document.getElementById('val-' + shape).textContent = value;
  }

  function setShapesColor(c) {
    shapesColor = c;
    document.getElementById('shape-color-white').className =
      'w-8 h-8 rounded-full border-2 transition-all ' + (c === '#ffffff' ? 'border-blue-500 scale-110' : 'border-gray-300');
    document.getElementById('shape-color-black').className =
      'w-8 h-8 rounded-full border-2 transition-all ' + (c === '#000000' ? 'border-blue-500 scale-110' : 'border-gray-300');
  }

  // ── Shape generation ──────────────────────────────────────────────────────
  function generateRandomShape() {
    const canvas = document.getElementById('canvas');
    bgColor = randomPastel();

    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = shapesColor;

    const cx = canvas.width / 2, cy = canvas.height / 2;
    for (let i = 0; i < shapeSettings.ovals; i++)     drawOval(cx, cy);
    for (let i = 0; i < shapeSettings.quads; i++)     drawQuad(cx, cy);
    for (let i = 0; i < shapeSettings.rectangles; i++) drawRect(cx, cy);
    for (let i = 0; i < shapeSettings.curves; i++)    drawBezier(cx, cy);
    for (let i = 0; i < shapeSettings.triangles; i++) drawTriangle(cx, cy);

    // Sync brush color if on background color option
    if (colorIndex === 2) {
      color = bgColor;
      updateColorIcon();
      updateCursor();
    }

    setTimeout(() => {
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width; tmp.height = canvas.height;
      tmp.getContext('2d').drawImage(canvas, 0, 0);
      beforeImage = tmp.toDataURL('image/png');
    }, 100);
  }

  function drawOval(cx, cy) {
    const x = cx + (Math.random() - 0.5) * 400;
    const y = cy + (Math.random() - 0.5) * 400;
    ctx.beginPath();
    ctx.ellipse(x, y, 40 + Math.random() * 120, 40 + Math.random() * 120, Math.random() * Math.PI * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawQuad(cx, cy) {
    const ox = (Math.random() - 0.5) * 300, oy = (Math.random() - 0.5) * 300;
    const pts = Array.from({length: 4}, (_, i) => {
      const a = (i / 4) * Math.PI * 2 + (Math.random() - 0.5);
      const d = 60 + Math.random() * 100;
      return [cx + ox + Math.cos(a) * d, cy + oy + Math.sin(a) * d];
    });
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.closePath(); ctx.fill();
  }

  function drawRect(cx, cy) {
    const x = cx + (Math.random() - 0.5) * 400, y = cy + (Math.random() - 0.5) * 400;
    const w = 60 + Math.random() * 150, h = 60 + Math.random() * 150;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.random() * Math.PI * 2);
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawBezier(cx, cy) {
    const canvas = document.getElementById('canvas');
    const size = (0.5 + Math.random() * 0.7) * canvas.width;
    const ox = (Math.random() - 0.5) * canvas.width * 0.25;
    const oy = (Math.random() - 0.5) * canvas.height * 0.25;
    const r = (f) => (Math.random() - 0.5) * size * f;
    const x1 = cx + ox + r(0.6), y1 = cy + oy + r(0.6);
    const x2 = cx + ox + r(0.6), y2 = cy + oy + r(0.6);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cx + ox + r(1.4), cy + oy + r(1.4), cx + ox + r(1.4), cy + oy + r(1.4), x2, y2);
    ctx.bezierCurveTo(cx + ox + r(1.4), cy + oy + r(1.4), cx + ox + r(1.4), cy + oy + r(1.4), x1, y1);
    ctx.closePath(); ctx.fill();
  }

  function drawTriangle(cx, cy) {
    const ox = (Math.random() - 0.5) * 400, oy = (Math.random() - 0.5) * 400;
    const size = 60 + Math.random() * 120, rot = Math.random() * Math.PI * 2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = rot + (i / 3) * Math.PI * 2;
      const x = cx + ox + Math.cos(a) * size, y = cy + oy + Math.sin(a) * size;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }

  // ── Drawing ───────────────────────────────────────────────────────────────
  function getPos(e) {
    const rect = document.getElementById('canvas').getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  }

  function onDown(e) {
    e.preventDefault();
    isDrawing = true;
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
  }

  function onMove(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.strokeStyle = color;
    ctx.lineWidth = brushSize;
    ctx.lineTo(p.x, p.y); ctx.stroke();
  }

  function onUp() { isDrawing = false; }

  // ── Cursor ────────────────────────────────────────────────────────────────
  function updateCursor() {
    const size = brushSize * 2;
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = size;
    const c = tmp.getContext('2d');
    c.beginPath();
    c.arc(size / 2, size / 2, brushSize, 0, Math.PI * 2);
    c.strokeStyle = color === bgColor ? '#666' : color === '#ffffff' ? '#000' : '#fff';
    c.lineWidth = 1; c.stroke();
    c.beginPath();
    c.arc(size / 2, size / 2, brushSize - 1, 0, Math.PI * 2);
    c.fillStyle = color; c.fill();
    document.getElementById('canvas').style.cursor = `url(${tmp.toDataURL()}) ${size/2} ${size/2}, crosshair`;
  }

  // ── Color & brush cycling ─────────────────────────────────────────────────
  function updateColorIcon() {
    document.getElementById('btn-color-swatch').setAttribute('fill', color);
    document.getElementById('btn-color-icon').setAttribute('fill', color === '#000000' ? 'white' : 'black');
  }

  function cycleColor() {
    colorIndex = (colorIndex + 1) % 3;
    color = ['#000000', '#ffffff', bgColor][colorIndex];
    updateColorIcon();
    updateCursor();
  }

  // ── Brush slider ─────────────────────────────────────────────────────────
  const BRUSH_TRACK_TOP = 12; // padding inset from the container's top/bottom edges
  const BRUSH_TRACK_HEIGHT = 141.75; // height of the track shape itself
  const BRUSH_KNOB_RADIUS = 15.75;
  const BRUSH_STOPS = [138, 110.4375, 82.875, 55.3125, 27.75]; // index i -> knob center Y; brushSizes[0]=2(bottom) ... brushSizes[4]=30(top)

  function syncBrushKnobPosition() {
    document.getElementById('btn-brush-knob').style.top = (BRUSH_STOPS[brushIndex] - BRUSH_KNOB_RADIUS) + 'px';
  }

  function setBrushIndex(i) {
    brushIndex = Math.max(0, Math.min(brushSizes.length - 1, i));
    brushSize = brushSizes[brushIndex];
    syncBrushKnobPosition();
    updateCursor();
  }

  function nearestBrushIndexForY(y) {
    const clamped = Math.max(BRUSH_TRACK_TOP + BRUSH_KNOB_RADIUS, Math.min(BRUSH_TRACK_TOP + BRUSH_TRACK_HEIGHT - BRUSH_KNOB_RADIUS, y));
    let nearest = 0, minDist = Infinity;
    BRUSH_STOPS.forEach((stopY, idx) => {
      const d = Math.abs(stopY - clamped);
      if (d < minDist) { minDist = d; nearest = idx; }
    });
    return { index: nearest, y: clamped };
  }

  let brushDragging = false;

  function onBrushKnobDown(e) {
    e.stopPropagation(); // don't also trigger the track's tap-to-jump handler
    brushDragging = true;
    e.target.setPointerCapture(e.pointerId);
  }

  function onBrushKnobMove(e) {
    if (!brushDragging) return;
    const rect = document.getElementById('btn-brush').getBoundingClientRect();
    const { index, y } = nearestBrushIndexForY(e.clientY - rect.top);
    document.getElementById('btn-brush-knob').style.top = (y - BRUSH_KNOB_RADIUS) + 'px'; // live-follow pointer
    if (index !== brushIndex) { brushIndex = index; brushSize = brushSizes[brushIndex]; updateCursor(); }
  }

  function onBrushKnobUp() {
    if (!brushDragging) return;
    brushDragging = false;
    setBrushIndex(brushIndex); // snap exactly onto the stop
  }

  function onBrushTrackDown(e) {
    const rect = document.getElementById('btn-brush').getBoundingClientRect();
    setBrushIndex(nearestBrushIndexForY(e.clientY - rect.top).index); // tap anywhere on track to jump
  }

  function clearCanvas() {
    const canvas = document.getElementById('canvas');
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // ── Menu ──────────────────────────────────────────────────────────────────
  function syncMenuButtonVisual() {
    const btn = document.getElementById('btn-menu');
    btn.style.setProperty('--btn-rgb', menuOpen ? '31,41,55' : '255,255,255');
    btn.querySelector('svg').innerHTML = menuOpen
      ? '<polyline points="18 15 12 9 6 15"/>'
      : '<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>';
  }

  function toggleMenu() {
    menuOpen = !menuOpen;
    syncMenuButtonVisual();

    cascadeTimeouts.forEach(clearTimeout);
    cascadeTimeouts = [];

    const menuRect = document.getElementById('btn-menu').getBoundingClientRect();
    const menuCenterY = menuRect.top + menuRect.height / 2;

    TOOLBAR_BUTTON_IDS.forEach((id, i) => {
      const el = document.getElementById(id);
      const delay = menuOpen
        ? (TOOLBAR_BUTTON_IDS.length - 1 - i) * CASCADE_STAGGER_MS  // opening: bottom button leads
        : i * CASCADE_STAGGER_MS;                                   // closing: top button leads
      el.style.transitionDelay = `0ms, 0ms, ${delay}ms, ${delay}ms`; // matches background-color, filter, transform, opacity order
      if (menuOpen) {
        el.style.transform = '';
        el.style.opacity = '';
        el.style.pointerEvents = '';
        cascadeTimeouts.push(setTimeout(() => { el.style.transitionDelay = ''; }, delay + CASCADE_TRANSFORM_MS));
      } else {
        // Align this element's center with the menu button's center — computed from
        // actual layout rather than a fixed-row-height formula, since #btn-brush is a
        // different height than the other 56px buttons and would otherwise collapse
        // toward the wrong point.
        const rect = el.getBoundingClientRect();
        const dist = (rect.top + rect.height / 2) - menuCenterY;
        el.style.transform = `translateY(${-dist}px) scale(0.2)`;
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
      }
    });
  }

  // ── Download modal ────────────────────────────────────────────────────────
  function openDownloadModal() {
    const canvas = document.getElementById('canvas');
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width; tmp.height = canvas.height;
    tmp.getContext('2d').drawImage(canvas, 0, 0);
    previewImage = tmp.toDataURL('image/png');
    selectedImages = new Set(['after']);

    document.getElementById('before-img').src = beforeImage || '';
    document.getElementById('after-img').src = previewImage;
    updateImageSelection();

    // Show long-press hint on mobile, action buttons on desktop
    document.getElementById('mobile-hint').style.display      = isMobile ? 'block' : 'none';
    document.getElementById('btn-cancel-preview').style.display = isMobile ? 'none' : '';
    document.getElementById('btn-save-doodles').style.display   = isMobile ? 'none' : '';

    document.getElementById('preview-modal').style.display = 'flex';
  }

  function toggleImageSelection(key) {
    selectedImages.has(key) ? selectedImages.delete(key) : selectedImages.add(key);
    updateImageSelection();
    document.getElementById('btn-save-doodles').disabled = selectedImages.size === 0;
    document.getElementById('btn-save-doodles').style.opacity = selectedImages.size === 0 ? '0.4' : '1';
  }

  function updateImageSelection() {
    ['before', 'after'].forEach(key => {
      const el = document.getElementById(key + '-container');
      const sel = selectedImages.has(key);
      el.className = 'flex items-center justify-center rounded-lg p-2 cursor-pointer transition-all ' +
        (sel ? 'ring-2 ring-blue-500 ring-offset-2' : 'ring-1 ring-gray-200 opacity-50');
      el.style.flex = '1';
    });
  }

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;

  function downloadFile(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    a.click();
  }

  function saveDoodles() {
    if (selectedImages.has('before') && beforeImage) downloadFile(beforeImage, 'doodle-before-' + Date.now() + '.png');
    if (selectedImages.has('after') && previewImage) downloadFile(previewImage, 'doodle-after-' + Date.now() + '.png');
    document.getElementById('preview-modal').style.display = 'none';
  }

  // ── Event binding ─────────────────────────────────────────────────────────
  function bindPressFeedback(el) {
    const press = () => el.classList.add('is-pressed');
    const release = () => el.classList.remove('is-pressed');
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release); // finger/cursor slides off before release
  }

  function bindEvents() {
    ['btn-menu', ...TOOLBAR_BUTTON_IDS].forEach(id => bindPressFeedback(document.getElementById(id)));

    const canvas = document.getElementById('canvas');
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('mouseleave', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);

    document.getElementById('btn-menu').addEventListener('click', toggleMenu);
    document.getElementById('btn-new-shape').addEventListener('click', generateRandomShape);
    document.getElementById('btn-clear').addEventListener('click', clearCanvas);
    document.getElementById('btn-download').addEventListener('click', openDownloadModal);
    document.getElementById('btn-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').style.display = 'flex';
    });
    document.getElementById('btn-color').addEventListener('click', cycleColor);

    bindPressFeedback(document.getElementById('btn-brush-knob'));
    const brushKnob = document.getElementById('btn-brush-knob');
    brushKnob.addEventListener('pointerdown', onBrushKnobDown);
    brushKnob.addEventListener('pointermove', onBrushKnobMove);
    brushKnob.addEventListener('pointerup', onBrushKnobUp);
    brushKnob.addEventListener('pointercancel', onBrushKnobUp);
    document.getElementById('btn-brush').addEventListener('pointerdown', onBrushTrackDown);

    document.getElementById('btn-close-preview').addEventListener('click', () => {
      document.getElementById('preview-modal').style.display = 'none';
    });
    document.getElementById('btn-cancel-preview').addEventListener('click', () => {
      document.getElementById('preview-modal').style.display = 'none';
    });
    document.getElementById('btn-save-doodles').addEventListener('click', saveDoodles);

    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').style.display = 'none';
    });
    document.getElementById('btn-done-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').style.display = 'none';
    });
  }

  init();
</script>
</body>
</html>
